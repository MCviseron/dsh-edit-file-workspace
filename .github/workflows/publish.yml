name: publish

# Publishes to npm through trusted publishing (OIDC): no NPM_TOKEN secret, no
# 2FA prompt, and every release carries an SLSA provenance attestation.
#
# One-time setup on npmjs.com → the package → Settings → Trusted Publisher:
#   Organization or user : MCviseron
#   Repository           : dsh-edit-file-workspace
#   Workflow filename    : publish.yml
#   Environment          : (leave empty)
#   Allow npm publish    : checked
#   Allow npm dist-tag   : checked
#
# Releasing: `npm version patch && git push --follow-tags`
#
# NOTE: do not set NODE_AUTH_TOKEN here — an empty bearer token breaks OIDC
# authentication. For a granular token instead, replace the publish step env
# with NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} and drop id-token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only run npm pack --dry-run'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (host half)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build bundles
        run: pnpm build

      - name: lib/ must match a fresh build
        run: |
          if [ -n "$(git status --porcelain lib)" ]; then
            echo "::error::lib/ is stale — run 'pnpm build' and commit the result."
            git --no-pager diff --stat -- lib
            exit 1
          fi

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      - name: npm pack --dry-run
        run: npm pack --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org
